# Base de dados H2 em memória, exclusiva dos testes.
spring.datasource.url=jdbc:h2:mem:studymatch_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria automaticamente as tabelas necessárias durante os testes.
# Não altera as tabelas do Supabase.
spring.jpa.hibernate.ddl-auto=create-drop

# Desativa funcionalidades desnecessárias durante os testes.
spring.jpa.open-in-view=false