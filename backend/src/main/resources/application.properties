
# Nome da aplicação Spring Boot.
spring.application.name=backend

# Endereço JDBC da base de dados PostgreSQL no Supabase.
# sslmode=require obriga a utilizar uma ligação encriptada.
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require

# Utilizador da base de dados Supabase
spring.datasource.username=${DB_USERNAME}

# Palavra-passe da base de dados Supabase
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC utilizado para comunicar com PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate valida as tabelas existentes sem as modificar.
# Mais tarde configuraremos as migrações da base de dados.
spring.jpa.hibernate.ddl-auto=validate

# Evita manter uma sessão de persistência aberta durante
# toda a resposta HTTP.
spring.jpa.open-in-view=false

# Inclui a mensagem dos erros (ex.: "O formato do email é inválido.")
# na resposta JSON, para o frontend a poder mostrar.
server.error.include-message=always

# Autenticação (Spring Security): duração do token de sessão.
studymatch.auth.token-ttl=PT8H

# Contas de demonstração criadas no arranque se ainda não existirem (DataSeeder).
# Em produção, definir as variáveis de ambiente com outras palavras-passe.
studymatch.seed.admin.username=${ADMIN_USER:admin}
studymatch.seed.admin.password=${ADMIN_PASSWORD:studymatch}
studymatch.seed.teacher.username=${DOCENTE_USER:docente}
studymatch.seed.teacher.password=${DOCENTE_PASSWORD:docente123}
